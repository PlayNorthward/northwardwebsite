<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northward</title>
  <meta name="description" content="Northward — a forthcoming video game. Subscribe for news." />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">Northward</div>
    <nav class="nav" aria-label="primary">
      <a class="nav-btn" href="/about.html">About</a>
      <a class="nav-btn" href="/press.html">Press</a>
    </nav>
  </header>

  <section class="hero">
    <video class="hero-video" src="/trailer.mp4" autoplay muted loop playsinline></video>

    <div class="hero-content">
      <img class="hero-logo" src="/logo.png" alt="Northward" />

      <a class="subscribe-button" href="https://store.steampowered.com/app/1876420/Northward" target="_blank" rel="noopener">Wishlist on Steam</a>

      <button class="newsletter-link" id="subscribe-toggle" type="button">Join Newsletter</button>

      <form
        class="newsletter"
        id="newsletter-form"
        name="newsletter"
        method="POST"
        data-netlify="true"
        netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="newsletter" />
        <p class="honeypot">
          <label>Don't fill this out: <input name="bot-field" /></label>
        </p>
        <div class="newsletter-row">
          <input
            type="email"
            name="email"
            placeholder="your@email.com"
            aria-label="Email address"
            required
          />
          <button type="submit">Subscribe</button>
        </div>
        <div class="newsletter-status" id="newsletter-status" role="status" aria-live="polite"></div>
      </form>
    </div>

    <nav class="socials" aria-label="social links">
      <a href="https://discord.gg/northward" target="_blank" rel="noopener" aria-label="Discord">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3.2a.074.074 0 0 0-.079.037c-.34.6-.719 1.385-.984 2.001a18.27 18.27 0 0 0-5.487 0 12.51 12.51 0 0 0-1-2.001.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 5.169 4.37a.07.07 0 0 0-.032.027C1.533 9.79.6 15.054 1.06 20.252a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.077.077 0 0 0 .084-.027 14.2 14.2 0 0 0 1.226-1.994.075.075 0 0 0-.041-.105 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.371-.291a.074.074 0 0 1 .078-.01c3.927 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .079.009c.12.099.245.198.372.292a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.891.076.076 0 0 0-.04.106c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .031-.056c.5-6.057-.838-11.283-3.548-15.857a.061.061 0 0 0-.031-.028zM8.02 17.085c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.974 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
      </a>
      <a href="https://www.youtube.com/@PlayNorthward" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.546 15.568V8.432L15.818 12l-6.272 3.568z"/>
        </svg>
      </a>
      <a href="https://x.com/PlayNorthward" target="_blank" rel="noopener" aria-label="X">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </a>
    </nav>
  </section>

  <script>
    (function () {
      var toggle = document.getElementById('subscribe-toggle');
      var form = document.getElementById('newsletter-form');
      var status = document.getElementById('newsletter-status');

      toggle.addEventListener('click', function () {
        form.classList.add('is-open');
        var input = form.querySelector('input[type="email"]');
        if (input) input.focus();
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var data = new URLSearchParams(new FormData(form)).toString();
        status.textContent = 'Sending…';
        fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: data
        }).then(function (res) {
          if (res.ok) {
            status.textContent = 'Thank you — you are on the list.';
            form.reset();
          } else {
            status.textContent = 'Something went wrong. Please try again.';
          }
        }).catch(function () {
          status.textContent = 'Something went wrong. Please try again.';
        });
      });
    })();
  </script>
</body>
</html>
