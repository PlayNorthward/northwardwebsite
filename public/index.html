<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northward — Coming Soon</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --white: #ffffff;
      --off-white: rgba(255, 255, 255, 0.7);
      --border: rgba(255, 255, 255, 1);
      --border-hover: rgba(255, 255, 255, 0.9);
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000000;
      color: var(--white);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Video Background ── */
    .video-wrapper {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000000;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .video-wrapper video.loaded {
      opacity: 1;
    }

    /* ── Header Nav ── */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 28px 40px;
    }

    .header-nav {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .header-nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.85;
      position: relative;
      transition: opacity 0.25s ease;
    }

    .header-nav a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--white);
      transition: width 0.3s ease;
    }

    .header-nav a:hover {
      opacity: 1;
    }

    .header-nav a:hover::after {
      width: 100%;
    }

    /* ── Main Content ── */
    main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      gap: 20px;
    }

    /* ── Game Logo ── */
    .game-logo {
      width: auto;
      max-width: min(1120px, 164vw);
      height: auto;
      display: block;
      /*filter: drop-shadow(0 2px 40px rgba(0,0,0,0.5)); */
      animation: logoFadeIn 1s ease 0.2s both;
    }

    @keyframes logoFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Wishlist Button ── */
    .wishlist-btn {
      display: inline-block;
      padding: 13px 40px;
      border: 1.5px solid var(--white);
      background: transparent;
      color: var(--white);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease;
      animation: fadeUp 0.8s ease 0.45s both;
      margin-top: 8px;
    }

    .wishlist-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .wishlist-btn:active {
      transform: scale(0.98);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Newsletter Link ── */
    .newsletter-link {
      color: var(--white);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-decoration: underline;
      text-underline-offset: 3px;
      opacity: 0.75;
      cursor: pointer;
      background: none;
      border: none;
      transition: opacity 0.25s ease;
      animation: fadeUp 0.8s ease 0.6s both;
    }

    .newsletter-link:hover {
      opacity: 1;
    }

    /* ── Newsletter Modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: rgba(10, 10, 10, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 48px 44px;
      max-width: 400px;
      width: 90%;
      transform: translateY(16px);
      transition: transform 0.3s ease;
    }

    .modal-backdrop.open .modal {
      transform: translateY(0);
    }

    .modal h2 {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .modal p {
      font-size: 13px;
      opacity: 0.6;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-form input[type="email"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--white);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .modal-form input[type="email"]::placeholder {
      opacity: 0.35;
      font-size: 13px;
    }

    .modal-form input[type="email"]:focus {
      border-color: rgba(255, 255, 255, 0.6);
    }

    .modal-form button[type="submit"] {
      padding: 12px 24px;
      border: 1.5px solid var(--white);
      background: transparent;
      color: var(--white);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease;
    }

    .modal-form button[type="submit"]:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .modal-form button[type="submit"]:active {
      transform: scale(0.98);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .modal-close:hover {
      color: var(--white);
    }

    .modal-message {
      font-size: 12px;
      min-height: 1.2em;
      margin-top: 4px;
      opacity: 0.8;
    }

    .modal-message.success { color: #a0e0a0; }
    .modal-message.error   { color: #e09090; }

    /* ── Bottom Corners ── */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 28px 40px;
      pointer-events: none;
    }

    /* Company logo — bottom left */
    .company-logo {
      pointer-events: all;
      display: flex;
      align-items: center;
    }

    .company-logo img {
      height: 32px;
      width: auto;
      opacity: 0.85;
      transition: opacity 0.25s ease;
      filter: brightness(0) invert(1);
    }

    .company-logo:hover img {
      opacity: 1;
    }

    /* Social icons — bottom right */
    .social-links {
      pointer-events: all;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .social-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: color 0.25s ease, transform 0.2s ease;
    }

    .social-links a:hover {
      color: var(--white);
      transform: translateY(-2px);
    }

    .social-links svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ── Screen reader only ── */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Video Background -->
  <div class="video-wrapper">
    <video autoplay muted loop playsinline preload="auto" id="bg-video">
      <source src="https://assets.playnorthward.com/trailerfadein.mp4" type="video/mp4">
    </video>

  <!-- Header Navigation (top right) -->
  <header class="site-header">
    <nav class="header-nav">
      <a href="/about.html">About</a>

    </nav>

  <!-- Main Content -->
  <main>

    <img

    <a

      target="_blank"
      rel="noopener noreferrer"

      Wishlist on Steam
    </a>

    <button class="newsletter-link" id="newsletter-trigger" type="button">
      Join Newsletter
    </button>

      <img src="companylogo.png" alt="Company Logo">
    </a>

    </div>
  </div>

  <!-- Newsletter Modal -->
  <div class="modal-backdrop" id="newsletter-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal" style="position:relative;">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <h2 id="modal-title">Newsletter</h2>
      <p>Stay updated on development, release dates, and exclusive early access offers.</p>
      <form class="modal-form" id="newsletter-form" novalidate>
        <input
          type="email"
          id="newsletter-email"
          name="email"
          placeholder="your@email.com"
          required
          autocomplete="email"
          inputmode="email"
        >
        <button type="submit">Subscribe</button>
        <p id="modal-message" class="modal-message" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script>
    // Video fade-in once it can play
    const video = document.getElementById('bg-video');
    const onCanPlay = () => {
      video.classList.add('loaded');
      video.removeEventListener('canplay', onCanPlay);
    };
    video.addEventListener('canplay', onCanPlay);
    if (video.readyState >= 3) onCanPlay();

    // Newsletter modal
    const modal    = document.getElementById('newsletter-modal');
    const trigger  = document.getElementById('newsletter-trigger');
    const closeBtn = document.getElementById('modal-close');
    const form     = document.getElementById('newsletter-form');
    const msgEl    = document.getElementById('modal-message');

    const openModal  = () => { modal.classList.add('open'); document.getElementById('newsletter-email').focus(); };
    const closeModal = () => modal.classList.remove('open');

    trigger.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('newsletter-email').value.trim();
      const btn = form.querySelector('button[type="submit"]');

      msgEl.textContent = '';
      msgEl.className = 'modal-message';
      btn.disabled = true;
      btn.textContent = 'Subscribing…';

      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (res.ok) {
          msgEl.textContent = "You're on the list!";
          msgEl.classList.add('success');
          form.reset();
        } else {
          msgEl.textContent = data.error || 'Something went wrong. Please try again.';
          msgEl.classList.add('error');
        }
      } catch {
        msgEl.textContent = 'Network error. Please try again.';
        msgEl.classList.add('error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Subscribe';
      }
    });
  </script>

</body>
</html>
